daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr notice;
events { worker_connections 256; }
http {
    lua_code_cache on;
    lua_check_client_abort on;
    lua_package_path './?.lua;./tdlua_eventloop/examples/openresty/?.lua;;';
    init_worker_by_lua_block {
        require("openresty_worker").start()
    }
    exit_worker_by_lua_block {
        require("openresty_worker").stop()
    }
    server {
        listen 127.0.0.1:8282;
        location /health { return 200 "ok\n"; }
        location / {
            default_type application/json;
            content_by_lua_block {
                require("openresty_worker").serve()
            }
            log_by_lua_block {
                require("openresty_worker").cleanup()
            }
        }
    }
}
