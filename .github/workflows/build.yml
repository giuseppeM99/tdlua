name: Build TDLua

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                lua: [5.2, 5.3, 5.4]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                submodules: true

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake gperf libssl-dev openssl zlib1g-dev lua${{ matrix.lua }} liblua${{ matrix.lua }}-dev

            - name: Configure
              run: |
                  cmake -S . -B build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DTDLUA_BUILD_TESTS=ON \
                    -DLUA_EXECUTABLE="$(command -v lua${{ matrix.lua }})"

            - name: Build
              run: cmake --build build --parallel 2

            - name: Test
              run: ctest --test-dir build --output-on-failure -R '^tdlua_'
