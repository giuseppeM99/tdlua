            zlib1g-dev

      - name: Download static TDLib package
        uses: actions/download-artifact@v8
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Configure and test LuaJIT
        run: |
          luajit_library="$(find /usr/lib /lib -name libluajit-5.1.so -print -quit)"
          test -n "$luajit_library"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TD_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlib" \
            -DTDLUA_LUA_IMPLEMENTATION=luajit \
            -DLUA_EXECUTABLE="$(command -v luajit)" \
            -DLUA_INCLUDE_DIR=/usr/include/luajit-2.1 \
            -DLUA_LIBRARY="$luajit_library"
          cmake --build build
          ctest --test-dir build --output-on-failure -R '^tdlua_'
          if ldd build/tdlua.so 2>/dev/null | grep -q 'libtdjson'; then
            echo "tdlua.so unexpectedly depends on shared libtdjson"
            exit 1
          fi

      # The matrix builds with TDLUA_BUILD_TESTS=ON so the suite can reach the
      # TDLUA_TESTING hooks, and that build exports them from the module. The
      # published artifact must not carry them, so rebuild the module with the
      # instrumentation disabled and assert the export table is clean.
      - name: Build production module
        run: |
          set -euo pipefail
          cmake -S . -B build -DTDLUA_BUILD_TESTS=OFF
          cmake --build build --target tdlua
          if nm -D --defined-only build/tdlua.so | grep -E 'tdlua_[A-Za-z0-9_]*_test_'; then
