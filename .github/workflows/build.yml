          test -f "$RUNNER_TEMP/tdlua-native-stage/lib/cmake/Td/TdStaticTargets.cmake"

      - name: Configure native backend
        run: |
          lua_library="$(find /usr/lib /lib -name liblua5.2.so -print -quit)"
          test -n "$lua_library"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TDLIB_CODEGEN_BUILD_DIR="$RUNNER_TEMP/tdlua-native-bootstrap" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlua-native-stage" \
