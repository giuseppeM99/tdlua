  luajit:
    name: LuaJIT / static TDLib
    needs: tdlib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            libluajit-5.1-dev \
            luajit \
            ninja-build \
