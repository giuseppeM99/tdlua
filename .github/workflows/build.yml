name: Build TDLua

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  tdlib:
    name: Build static TDLib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Restore TDLib build cache
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            td-build
            .ci/tdlib
            .ci/tdlib-static.tar.gz
          key: tdlib-static-${{ runner.os }}-${{ hashFiles('td/**') }}
          restore-keys: |
            tdlib-static-${{ runner.os }}-

      - name: Configure static TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S td -B td-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DTD_INSTALL_STATIC_LIBRARIES=ON \
            -DTD_INSTALL_SHARED_LIBRARIES=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/tdlib"

      - name: Build static TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: cmake --build td-build --target tdjson_static

      - name: Install static TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          cmake --install td-build
          test -f "$GITHUB_WORKSPACE/.ci/tdlib/lib/libtdjson_static.a"
          tdlib_version="$(sed -n 's/^project(TDLib VERSION \([^ ]*\).*/\1/p' td/CMakeLists.txt)"
          test -n "$tdlib_version"
          printf '%s\n' "$tdlib_version" > "$GITHUB_WORKSPACE/.ci/tdlib/tdlib-version.txt"
          tar -C "$GITHUB_WORKSPACE/.ci/tdlib" \
            -czf "$GITHUB_WORKSPACE/.ci/tdlib-static.tar.gz" .

      - name: Verify static TDLib cache
        run: |
          test -f .ci/tdlib/lib/libtdjson_static.a
          test -f .ci/tdlib/tdlib-version.txt
          test -f .ci/tdlib-static.tar.gz

      - name: Upload static TDLib package
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-static
          path: .ci/tdlib-static.tar.gz
          if-no-files-found: error
          retention-days: 1

  lua:
    name: Lua ${{ matrix.lua }} / static TDLib
    needs: tdlib
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.2", "5.3", "5.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            liblua${{ matrix.lua }}-dev \
            lua${{ matrix.lua }} \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Download static TDLib package
        uses: actions/download-artifact@v4
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Configure TDLua
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TD_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlib" \
            -DLUA_EXECUTABLE="$(command -v lua${{ matrix.lua }})" \
            -DLUA_INCLUDE_DIR="/usr/include/lua${{ matrix.lua }}" \
            -DLUA_LIBRARY="/usr/lib/x86_64-linux-gnu/liblua${{ matrix.lua }}.so"

      - name: Build TDLua and regression tests
        run: cmake --build build --target tdlua tdlua_codec_test

      - name: Verify static TDLua and TDLib version
        run: |
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' dist.info)"
          tdlib_version="$(cat "$RUNNER_TEMP/tdlib/tdlib-version.txt")"
          test "$(cat build/tdlua-version.txt)" = "${base_version}-${tdlib_version}"
          if ldd build/tdlua.so 2>/dev/null | grep -q 'libtdjson'; then
            echo "tdlua.so unexpectedly depends on shared libtdjson"
            exit 1
          fi

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure -R '^tdlua_'

      - name: Check Lua examples
        run: |
          for example in examples/*.lua; do
            luac${{ matrix.lua }} -p "$example"
          done

      - name: Verify installation
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/tdlua-install"
          test -f "$RUNNER_TEMP/tdlua-install/lib/lua/${{ matrix.lua }}/tdlua.so"

      - name: Prepare static Lua artifact
        id: artifact
        run: |
          version="$(cat build/tdlua-version.txt)"
          artifact="tdlua-${{ matrix.lua }}-${version}-linux-x86_64.so"
          cp build/tdlua.so "build/${artifact}"
          echo "path=build/${artifact}" >> "$GITHUB_OUTPUT"
          echo "name=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload static Lua artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlua-lua${{ matrix.lua }}-static
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  lua55:
    name: Lua 5.5 / static TDLib
    needs: tdlib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            curl \
            gperf \
            libssl-dev \
            ninja-build \
            openssl \
            zlib1g-dev

      - name: Build Lua 5.5
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz | tar -xz
          make -C lua-5.5.0 linux \
            MYCFLAGS="-fPIC" \
            MYLDFLAGS="-fPIC"
          make -C lua-5.5.0 install \
            INSTALL_TOP="$RUNNER_TEMP/lua55"

      - name: Download static TDLib package
        uses: actions/download-artifact@v4
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Configure and test Lua 5.5
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TD_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlib" \
            -DTDLUA_LUA_VERSION=5.5 \
            -DLUA_EXECUTABLE="$RUNNER_TEMP/lua55/bin/lua" \
            -DLUA_INCLUDE_DIR="$RUNNER_TEMP/lua55/include" \
            -DLUA_LIBRARY="$RUNNER_TEMP/lua55/lib/liblua.a"
          cmake --build build --target tdlua tdlua_codec_test
          ctest --test-dir build --output-on-failure -R '^tdlua_'
          if ldd build/tdlua.so 2>/dev/null | grep -q 'libtdjson'; then
            echo "tdlua.so unexpectedly depends on shared libtdjson"
            exit 1
          fi

      - name: Prepare static Lua artifact
        id: artifact
        run: |
          version="$(cat build/tdlua-version.txt)"
          artifact="tdlua-5.5-${version}-linux-x86_64.so"
          cp build/tdlua.so "build/${artifact}"
          echo "path=build/${artifact}" >> "$GITHUB_OUTPUT"
          echo "name=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload static Lua artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlua-lua5.5-static
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  native:
    name: Native backend / C++23 / Lua 5.5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            curl \
            gperf \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Build Lua 5.5
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz | tar -xz
          make -C lua-5.5.0 linux \
            MYCFLAGS="-fPIC" \
            MYLDFLAGS="-fPIC"
          make -C lua-5.5.0 install \
            INSTALL_TOP="$RUNNER_TEMP/lua55"

      - name: Configure native backend
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=ON \
            -DTDLUA_LUA_VERSION=5.5 \
            -DLUA_EXECUTABLE="$RUNNER_TEMP/lua55/bin/lua" \
            -DLUA_INCLUDE_DIR="$RUNNER_TEMP/lua55/include" \
            -DLUA_LIBRARY="$RUNNER_TEMP/lua55/lib/liblua.a"

      - name: Build and test native backend
        run: |
          cmake --build build --target tdlua tdlua_codec_test
          ctest --test-dir build --output-on-failure -R '^tdlua_'

  native-sanitizers:
    name: Native backend / ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            curl \
            gperf \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Build Lua 5.5
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz | tar -xz
          make -C lua-5.5.0 linux \
            MYCFLAGS="-fPIC" \
            MYLDFLAGS="-fPIC"
          make -C lua-5.5.0 install \
            INSTALL_TOP="$RUNNER_TEMP/lua55"

      - name: Configure sanitized native backend
        env:
          SANITIZER_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SANITIZER_FLAGS" \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=ON \
            -DTDLUA_LUA_VERSION=5.5 \
            -DLUA_EXECUTABLE="$RUNNER_TEMP/lua55/bin/lua" \
            -DLUA_INCLUDE_DIR="$RUNNER_TEMP/lua55/include" \
            -DLUA_LIBRARY="$RUNNER_TEMP/lua55/lib/liblua.a"

      - name: Build and test sanitized native backend
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --build build --target tdlua tdlua_codec_test
          ctest --test-dir build --output-on-failure -R '^tdlua_'

  luajit:
    name: LuaJIT / static TDLib
    needs: tdlib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            libluajit-5.1-dev \
            luajit \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Download static TDLib package
        uses: actions/download-artifact@v4
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Configure and test LuaJIT
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TD_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlib" \
            -DLUA_EXECUTABLE="$(command -v luajit)" \
            -DLUA_INCLUDE_DIR=/usr/include/luajit-2.1 \
            -DLUA_LIBRARY=/usr/lib/x86_64-linux-gnu/libluajit-5.1.so
          cmake --build build --target tdlua tdlua_codec_test
          ctest --test-dir build --output-on-failure -R '^tdlua_'
          if ldd build/tdlua.so 2>/dev/null | grep -q 'libtdjson'; then
            echo "tdlua.so unexpectedly depends on shared libtdjson"
            exit 1
          fi

      - name: Prepare static LuaJIT artifact
        id: artifact
        run: |
          version="$(cat build/tdlua-version.txt)"
          artifact="tdlua-luajit-${version}-linux-x86_64.so"
          cp build/tdlua.so "build/${artifact}"
          echo "path=build/${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload static LuaJIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlua-luajit-static
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  luarocks:
    name: LuaRocks package
    needs: tdlib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            liblua5.3-dev \
            lua5.3 \
            luarocks \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Download static TDLib package
        uses: actions/download-artifact@v4
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Validate rockspec
        run: luarocks --lua-version=5.3 lint tdlua-scm-1.rockspec

      - name: Build and install rock
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 1
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/tdlib
          TDLUA_BUNDLED_TDLIB: OFF
          TDLUA_TD_STATIC: ON
        run: |
          luarocks --lua-version=5.3 \
            --tree="$RUNNER_TEMP/rocks" \
            make --no-doc tdlua-scm-1.rockspec

      - name: Load installed module
        run: |
          eval "$(luarocks --lua-version=5.3 --tree=\"$RUNNER_TEMP/rocks\" path)"
          LUA_CPATH="$RUNNER_TEMP/rocks/lib/lua/5.3/?.so;$LUA_CPATH" \
            lua5.3 -e 'assert(require("tdlua"))'

  telegram:
    name: Telegram upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lua, lua55]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.3-dev \
            lua5.3 \
            libssl-dev \
            zlib1g-dev

      - name: Download all static Lua artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tdlua-lua5.*-static
          path: ${{ runner.temp }}/tdlua-artifacts
          merge-multiple: true

      - name: Upload static artifacts to Telegram in one session
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || secrets.token }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.chat_id }}
          TDLUA_DATABASE_DIR: ${{ runner.temp }}/tdlua-telegram-session
        run: |
          if [ -z "$TG_APP_ID" ] || [ -z "$TG_APP_HASH" ] || \
             [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram upload secrets are not configured; skipping upload"
            exit 0
          fi
          module="$(find "$RUNNER_TEMP/tdlua-artifacts" \
            -type f -name 'tdlua-5.3-*.so' -print -quit)"
          test -n "$module"
          mkdir -p "$RUNNER_TEMP/tdlua-module"
          cp "$module" "$RUNNER_TEMP/tdlua-module/tdlua.so"
          artifacts="$(find "$RUNNER_TEMP/tdlua-artifacts" \
            -type f -name 'tdlua-*.so' -print | sort | paste -sd, -)"
          test -n "$artifacts"
          LUA_CPATH="$RUNNER_TEMP/tdlua-module/?.so" \
          TDLUA_ARTIFACTS="$artifacts" \
            lua5.3 examples/uploadtravis.lua
