  native-sanitizers:
    name: Native backend / TDLua ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci/tdlua-ccache
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            curl \
            gperf \
            libreadline-dev \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Record toolchain
        id: toolchain
        run: |
          printf 'gcc=%s\n' "$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          ccache --version | head -n 1

      - name: Restore native compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci/tdlua-ccache
          key: tdlua-native-debug-ccache-${{ runner.os }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-v1-${{ hashFiles('td/CMakeLists.txt', 'td/td/generate/scheme/td_api.tl') }}
          restore-keys: |
            tdlua-native-debug-ccache-${{ runner.os }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-v1-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build Lua 5.5
        uses: ./.github/actions/lua55
      - name: Configure sanitized native backend
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_ENABLE_SANITIZERS=ON \
            -DTDLUA_BUNDLED_TDLIB=ON \
            -DTDLUA_LUA_VERSION=5.5 \
            -DLUA_EXECUTABLE="$RUNNER_TEMP/lua55/bin/lua" \
            -DLUA_INCLUDE_DIR="$RUNNER_TEMP/lua55/include" \
            -DLUA_LIBRARY="$RUNNER_TEMP/lua55/lib/liblua.a"

      - name: Build and test sanitized native backend
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure -R '^tdlua_'

      - name: Report native compiler cache
        run: ccache --show-stats

