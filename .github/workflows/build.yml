  luajit:
    name: LuaJIT / static TDLib
    needs: tdlib
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            libluajit-5.1-dev \
            luajit \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Download static TDLib package
        uses: actions/download-artifact@v8
        with:
          name: tdlib-static
          path: ${{ runner.temp }}/tdlib-artifact

      - name: Extract static TDLib package
        run: |
          mkdir -p "$RUNNER_TEMP/tdlib"
          tar -xzf "$RUNNER_TEMP/tdlib-artifact/tdlib-static.tar.gz" \
            -C "$RUNNER_TEMP/tdlib"

      - name: Configure and test LuaJIT
        run: |
          luajit_library="$(find /usr/lib /lib -name libluajit-5.1.so -print -quit)"
          test -n "$luajit_library"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TD_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlib" \
            -DTDLUA_LUA_IMPLEMENTATION=luajit \
            -DLUA_EXECUTABLE="$(command -v luajit)" \
            -DLUA_INCLUDE_DIR=/usr/include/luajit-2.1 \
            -DLUA_LIBRARY="$luajit_library"
          cmake --build build
          ctest --test-dir build --output-on-failure -R '^tdlua_'
          if ldd build/tdlua.so 2>/dev/null | grep -q 'libtdjson'; then
            echo "tdlua.so unexpectedly depends on shared libtdjson"
            exit 1
          fi

      - name: Prepare static LuaJIT artifact
        id: artifact
        run: |
          version="$(cat build/tdlua-version.txt)"
          artifact="tdlua-luajit-${version}-linux-x86_64.so"
          cp build/tdlua.so "build/${artifact}"
          echo "path=build/${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload static LuaJIT artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlua-luajit-static
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Check LuaJIT examples
        run: luajit -b examples/luajit.lua "$RUNNER_TEMP/luajit-example.bc"

