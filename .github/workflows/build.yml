  native-lua54:
    name: Native backend / C++23 / Lua 5.4
    runs-on: ubuntu-24.04
    needs: tdlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gperf \
            liblua5.4-dev \
            lua5.4 \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Download pinned TDLib native codegen build
        uses: actions/download-artifact@v8
        with:
          name: tdlib-native-codegen
          path: ${{ runner.temp }}/tdlib-native-codegen

      - name: Extract pinned TDLib native codegen build
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/tdlib-native-codegen/tdlib-native-codegen.tar.gz" \
            -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/tdlua-native-bootstrap/CMakeCache.txt"
          test -f "$RUNNER_TEMP/tdlua-native-stage/lib/cmake/Td/TdStaticTargets.cmake"

      - name: Configure native backend
        run: |
          lua_library="$(find /usr/lib /lib -name liblua5.4.so -print -quit)"
          test -n "$lua_library"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_BUNDLED_TDLIB=OFF \
            -DTDLUA_TDLIB_CODEGEN_BUILD_DIR="$RUNNER_TEMP/tdlua-native-bootstrap" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tdlua-native-stage" \
            -DTDLUA_LUA_VERSION=5.4 \
            -DLUA_EXECUTABLE="$(command -v lua5.4)" \
            -DLUA_INCLUDE_DIR=/usr/include/lua5.4 \
            -DLUA_LIBRARY="$lua_library"

      - name: Build and test native backend
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure -R '^tdlua_'

      # The matrix builds with TDLUA_BUILD_TESTS=ON so the suite can reach the
      # TDLUA_TESTING hooks, and that build exports them from the module. The
      # published artifact must not carry them, so rebuild the module with the
      # instrumentation disabled and assert the export table is clean.
      - name: Build production module
        run: |
          set -euo pipefail
          cmake -S . -B build -DTDLUA_BUILD_TESTS=OFF
          cmake --build build --target tdlua
          if nm -D --defined-only build/tdlua.so | grep -E 'tdlua_[A-Za-z0-9_]*_test_'; then
            echo "::error::production module exports test hooks"
            exit 1
          fi

      - name: Prepare native Lua 5.4 artifact
        id: artifact
        run: |
          version="$(cat build/tdlua-version.txt)"
          artifact="tdlua-5.4-native-${version}-linux-x86_64.so"
          cp build/tdlua.so "build/${artifact}"
          echo "path=build/${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload native Lua 5.4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlua-native-lua5.4-static
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  native-sanitizers:
    name: Native backend / TDLua ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci/tdlua-ccache
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            curl \
            gperf \
            ninja-build \
            openssl \
            libssl-dev \
            zlib1g-dev

      - name: Record toolchain
        id: toolchain
        run: |
          printf 'gcc=%s\n' "$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          ccache --version | head -n 1

      - name: Restore native compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci/tdlua-ccache
          key: tdlua-native-debug-ccache-${{ runner.os }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-v1-${{ hashFiles('td/CMakeLists.txt', 'td/td/generate/scheme/td_api.tl') }}
          restore-keys: |
            tdlua-native-debug-ccache-${{ runner.os }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-v1-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build Lua 5.5
        env:
          LUA55_SHA256: 57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d
        run: |
          set -euo pipefail
          curl -fsSLo lua-5.5.0.tar.gz https://www.lua.org/ftp/lua-5.5.0.tar.gz
          printf '%s  %s\n' "$LUA55_SHA256" lua-5.5.0.tar.gz | sha256sum -c -
          tar -xzf lua-5.5.0.tar.gz
          make -C lua-5.5.0 linux \
            MYCFLAGS="-fPIC" \
            MYLDFLAGS="-fPIC"
          make -C lua-5.5.0 install \
            INSTALL_TOP="$RUNNER_TEMP/lua55"

      - name: Configure sanitized native backend
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTDLUA_BACKEND=native \
            -DTDLUA_BUILD_TESTS=ON \
            -DTDLUA_ENABLE_SANITIZERS=ON \
            -DTDLUA_BUNDLED_TDLIB=ON \
            -DTDLUA_LUA_VERSION=5.5 \
            -DLUA_EXECUTABLE="$RUNNER_TEMP/lua55/bin/lua" \
            -DLUA_INCLUDE_DIR="$RUNNER_TEMP/lua55/include" \
            -DLUA_LIBRARY="$RUNNER_TEMP/lua55/lib/liblua.a"

      - name: Build and test sanitized native backend
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure -R '^tdlua_'

      - name: Report native compiler cache
        run: ccache --show-stats

