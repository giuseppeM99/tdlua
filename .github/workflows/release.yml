name: Release TDLua

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate all supported runtimes
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    name: Package and publish release artifacts
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download validated runtime artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tdlua-*-static
          path: ${{ runner.temp }}/tdlua-artifacts
          merge-multiple: true

      - name: Verify release version and runtime matrix
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base_version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' dist.info)"
          test "${RELEASE_TAG#v}" = "$base_version"
          count="$(find "$RUNNER_TEMP/tdlua-artifacts" -type f -name '*.so' | wc -l)"
          test "$count" -eq 10
          for pattern in \
            'tdlua-5.2-*.so' \
            'tdlua-5.3-*.so' \
            'tdlua-5.4-*.so' \
            'tdlua-5.5-*.so' \
            'tdlua-luajit-*.so' \
            'tdlua-5.2-native-*.so' \
            'tdlua-5.3-native-*.so' \
            'tdlua-5.4-native-*.so' \
            'tdlua-5.5-native-*.so' \
            'tdlua-luajit-native-*.so'; do
            find "$RUNNER_TEMP/tdlua-artifacts" -type f -name "$pattern" -print -quit | grep -q .
          done

      - name: Create source bundle and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' dist.info)"
          root="tdlua-${RELEASE_TAG}"
          source_url="https://github.com/giuseppeM99/tdlua/releases/download/${RELEASE_TAG}/tdlua-${RELEASE_TAG}-source.tar.gz"

          mkdir -p "release/${root}" release-artifacts
          git archive HEAD | tar -x -C "release/${root}"
          for module in td base64; do
            mkdir -p "release/${root}/${module}"
            git -C "${module}" archive HEAD | tar -x -C "release/${root}/${module}"
          done
          tar -C release -czf "tdlua-${RELEASE_TAG}-source.tar.gz" "${root}"

          for package in tdlua tdlua-luajit; do
            rockspec="${package}-${RELEASE_TAG}.rockspec"
            cp "${package}-scm-1.rockspec" "$rockspec"
            sed -i \
              -e "s/version = \"scm-1\"/version = \"${base_version}-1\"/" \
              -e "s|url = \"git+https://github.com/giuseppeM99/tdlua.git\"|url = \"${source_url}\"|" \
              -e '/branch = "master"/d' \
              "$rockspec"
          done

          cp "$RUNNER_TEMP/tdlua-artifacts"/*.so release-artifacts/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            tdlua-${{ github.ref_name }}-source.tar.gz
            tdlua-${{ github.ref_name }}.rockspec
            tdlua-luajit-${{ github.ref_name }}.rockspec
            release-artifacts/*.so
