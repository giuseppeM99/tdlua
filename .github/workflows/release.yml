# Publishing path. Only a tag push reaches this workflow; the payload is built
# and verified by release-package.yml, and only the final job can write to the
# repository. Everything before it runs read-only.

name: Release TDLua

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify the release payload
    uses: ./.github/workflows/release-package.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Defence in depth: a branch push can never reach the publishing job even
    # if the trigger above is ever widened by mistake.
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release notes
        id: notes
        run: |
          set -euo pipefail
          notes="release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          grep -q "^# TDLua ${GITHUB_REF_NAME#v}" "$notes"
          "$GITHUB_WORKSPACE/tools/release/verify-release-metadata.sh" "$notes" third-party/Lua-5.5.txt
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Download verified payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tdlua-release-package
          path: payload

      - name: Verify payload checksums before publishing
        run: |
          set -euo pipefail
          cd payload
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.so' | wc -l)" -eq 11
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.rockspec' | wc -l)" -eq 3
          test -f Lua-5.5-LICENSE.txt
          cmp Lua-5.5-LICENSE.txt "$GITHUB_WORKSPACE/third-party/Lua-5.5.txt"
          "$GITHUB_WORKSPACE/tools/release/verify-release-metadata.sh" \
            "$GITHUB_WORKSPACE/release-notes/${GITHUB_REF_NAME}.md" \
            Lua-5.5-LICENSE.txt
          test "$(grep -c '  ' SHA256SUMS)" -eq 24
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 25
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          files: payload/*
