# Publishing path. Only a tag push reaches this workflow; the payload is built
# and verified by release-package.yml, and only the final job can write to the
# repository. Everything before it runs read-only.

name: Release TDLua

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify the release payload
    uses: ./.github/workflows/release-package.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Defence in depth: a branch push can never reach the publishing job even
    # if the trigger above is ever widened by mistake.
    if: github.ref_type == 'tag'

    steps:
      - name: Download verified payload
        uses: actions/download-artifact@v8
        with:
          name: tdlua-release-package
          path: payload

      - name: Verify payload checksums before publishing
        run: |
          set -euo pipefail
          cd payload
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.so' | wc -l)" -eq 10
          test "$(find . -maxdepth 1 -name '*.rockspec' | wc -l)" -eq 2
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: payload/*
