name: Windows MSVC JSON validation

on:
  push:
    branches: [vnext-portability-clean, v0.5.1-consolidated]
    paths:
      - '.github/workflows/windows-msvc-json.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/windows/**'
      - 'td'
  pull_request:
    branches: [vnext-portability-clean, v0.5.1-consolidated]
    paths:
      - '.github/workflows/windows-msvc-json.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/windows/**'
      - 'td'
  # release-package.yml calls this workflow so the Windows package is built in
  # the same run as the payload. A standalone push run is unchanged: the branch
  # filter above already excludes packaging branches and tags.
  workflow_call:

permissions:
  contents: read

env:
  TDLIB_COMMIT: c15d3f5a5de6e3ba5839822c451152e5e18bb700
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  # vcpkg's default binary cache lives under %LOCALAPPDATA% on the runner, so it
  # is empty at the start of every job and OpenSSL, zlib and gperf are compiled
  # again each time. Point the files provider at a workspace directory that the
  # job caches and restores instead.
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-archives,readwrite

jobs:
  windows-msvc-json:
    name: Windows 2022 / MSVC x64 / Lua 5.4.8 / JSON
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout pinned repository and TDLib
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Record runner and toolchain provenance
        id: provenance
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci\windows-msvc | Out-Null
          $log = '.ci\windows-msvc\provenance.log'
          @(
            (Get-Date -Format o)
            (Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber | Format-List | Out-String)
            (Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String)
            (Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory | Format-List | Out-String)
            (Get-PSDrive -Name D | Format-List | Out-String)
            "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"
            (& cl.exe /Bv 2>&1 | Out-String)
            (& cmake --version | Out-String)
            (& ninja --version | Out-String)
            (& dumpbin.exe /? 2>&1 | Select-Object -First 2 | Out-String)
            "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
            (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD 2>&1 | Out-String)
            "TDLib HEAD: $(& git -C td rev-parse HEAD)"
            "TDLib worktree: $(& git -C td status --porcelain)"
            "TDLib gitlink: $(& git ls-tree HEAD td)"
            "TDLib schema SHA-256: $((Get-FileHash -Algorithm SHA256 td\td\generate\scheme\td_api.tl).Hash)"
          ) | Tee-Object -FilePath $log
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'MSVC environment is not x64' }
          if ((git -C td rev-parse HEAD).Trim() -ne $env:TDLIB_COMMIT) { throw 'TDLib submodule commit mismatch' }
          $tdlibStatus = @(& git -C td status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect TDLib submodule status: $LASTEXITCODE" }
          if ($tdlibStatus.Count -gt 0) { throw 'TDLib submodule has local modifications' }
          $clText = (& cl.exe /Bv 2>&1 | Out-String)
          $clVersion = [regex]::Match($clText, '19\.\d+\.\d+').Value
          # The SDK version has to come from the environment the compiler uses.
          # The directory listing is only the last resort: it also contains
          # entries such as 'wdf', which sort above the version directories and
          # used to end up in the cache key.
          $sdk = ([regex]::Match([string]$env:INCLUDE, 'Windows Kits\\10\\Include\\(\d+\.\d+\.\d+\.\d+)')).Groups[1].Value
          if (-not $sdk -and $env:WindowsSDKVersion) {
            $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          }
          if (-not $sdk) {
            $sdk = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
            "Neither INCLUDE nor WindowsSDKVersion named the SDK; fell back to the newest version directory" |
              Tee-Object -Append -FilePath $log
          }
          if (-not $sdk) { throw 'Could not determine the Windows SDK version in use' }
          $vcpkgCommit = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          "cl=$clVersion" >> $env:GITHUB_OUTPUT
          "sdk=$sdk" >> $env:GITHUB_OUTPUT
          "vcpkg=$vcpkgCommit" >> $env:GITHUB_OUTPUT
          "schema=$((Get-FileHash -Algorithm SHA256 td\td\generate\scheme\td_api.tl).Hash)" >> $env:GITHUB_OUTPUT

      - name: Restore the pinned vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-archives
          key: vcpkg-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ steps.provenance.outputs.vcpkg }}-x64-windows-v1
          restore-keys: |
            vcpkg-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ steps.provenance.outputs.vcpkg }}-

      - name: Install pinned tool dependencies with vcpkg
        id: vcpkg-install
        run: |
          $ErrorActionPreference = 'Stop'
          # VCPKG_BINARY_SOURCES points here. Create it first so a restore miss
          # cannot turn into a vcpkg failure.
          New-Item -ItemType Directory -Force .ci\vcpkg-archives | Out-Null
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install openssl:x64-windows zlib:x64-windows gperf:x64-windows 2>&1 | Tee-Object -FilePath .ci\windows-msvc\vcpkg-install.log
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }
          & $vcpkg list | Tee-Object -FilePath .ci\windows-msvc\vcpkg-packages.log
          $tools = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\tools'
          $gperf = Get-ChildItem $tools -Filter gperf.exe -Recurse | Select-Object -First 1
          if (-not $gperf) { throw 'vcpkg did not install host gperf.exe' }
          $env:PATH = "$($gperf.DirectoryName);$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          "Gperf path: $($gperf.FullName)" | Tee-Object -FilePath .ci\windows-msvc\gperf.log
          & $gperf.FullName --version | Tee-Object -Append -FilePath .ci\windows-msvc\gperf.log
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-archives
          key: vcpkg-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ steps.provenance.outputs.vcpkg }}-x64-windows-v1

      - name: Restore pinned TDLib MSVC package
        id: tdlib-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci/windows-msvc/tdlib
          key: tdlib-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ env.TDLIB_COMMIT }}-${{ steps.provenance.outputs.schema }}-${{ steps.provenance.outputs.vcpkg }}-release-shared-${{ hashFiles('td/CMakeLists.txt', '.github/workflows/windows-msvc-json.yml') }}
          restore-keys: |
            tdlib-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ env.TDLIB_COMMIT }}-${{ steps.provenance.outputs.schema }}-${{ steps.provenance.outputs.vcpkg }}-release-shared-

      - name: Validate restored TDLib cache before deciding to build
        id: tdlib-package-check
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib'
          $manifest = Join-Path $prefix 'tdlua-tdlib-manifest.txt'
          $valid = Test-Path $manifest
          $reasons = @()
          if ($valid) {
            $content = Get-Content $manifest -Raw
            $schema = (Get-FileHash -Algorithm SHA256 td\td\generate\scheme\td_api.tl).Hash
            $expected = @(
              "commit=$env:TDLIB_COMMIT",
              "schema=$schema",
              'cl=${{ steps.provenance.outputs.cl }}',
              'sdk=${{ steps.provenance.outputs.sdk }}',
              'generator=Ninja',
              'build_type=Release',
              'triplet=x64-windows',
              'td_install_shared=ON',
              'td_install_static=OFF',
              "vcpkg=$(& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)"
            )
            foreach ($entry in $expected) {
              if ($content -notmatch [regex]::Escape($entry)) {
                $valid = $false
                $reasons += "manifest mismatch: $entry"
              }
            }
            $tdjson = Join-Path $prefix 'bin\tdjson.dll'
            $importLibrary = Join-Path $prefix 'lib\tdjson.lib'
            if (-not (Test-Path $tdjson) -or -not (Test-Path $importLibrary)) {
              $valid = $false
              $reasons += 'TDLib DLL or import library missing'
            } else {
              $tdjsonHash = (Get-FileHash -Algorithm SHA256 $tdjson).Hash
              $importHash = (Get-FileHash -Algorithm SHA256 $importLibrary).Hash
              if ($content -notmatch [regex]::Escape("tdjson=$tdjsonHash") -or
                  $content -notmatch [regex]::Escape("tdjson_import=$importHash")) {
                $valid = $false
                $reasons += 'TDLib artifact hash mismatch'
              }
              $headers = dumpbin.exe /headers $tdjson | Out-String
              if ($LASTEXITCODE -ne 0 -or $headers -notmatch '8664 machine') {
                $valid = $false
                $reasons += 'TDLib DLL is not PE x64'
              }
            }
          } else {
            $reasons += 'no restored TDLib manifest'
          }
          "valid=$($valid.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_OUTPUT
          if ($valid) {
            'Verified cached TDLib package matches pinned source, schema, toolchain, dependencies, and hashes.' |
              Tee-Object -FilePath .ci\windows-msvc\tdlib-cache-decision.log
          } else {
            "Rebuilding TDLib: $($reasons -join '; ')" |
              Tee-Object -FilePath .ci\windows-msvc\tdlib-cache-decision.log
          }

      - name: Build TDLib 1.8.68 shared JSON package
        if: steps.tdlib-package-check.outputs.valid != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = (Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib')
          $build = (Join-Path $env:RUNNER_TEMP 'tdlib-msvc-build')
          if (Test-Path $prefix) { Remove-Item -Recurse -Force $prefix }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts\buildsystems\vcpkg.cmake'
          $gperf = (Get-ChildItem (Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\tools') -Filter gperf.exe -Recurse | Select-Object -First 1).DirectoryName
          $env:PATH = "$gperf;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          cmake -S td -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DTD_INSTALL_SHARED_LIBRARIES=ON `
            -DTD_INSTALL_STATIC_LIBRARIES=OFF `
            -DTD_ENABLE_JNI=OFF `
            -DTD_ENABLE_DOTNET=OFF
          if ($LASTEXITCODE -ne 0) { throw "TDLib configure failed: $LASTEXITCODE" }
          cmake --build $build --target tdjson --config Release --parallel 2 2>&1 | Tee-Object -FilePath .ci\windows-msvc\tdlib-build.log
          if ($LASTEXITCODE -ne 0) { throw "TDLib build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path '.ci\windows-msvc\tdlib' | Out-Null
          Copy-Item (Join-Path $build 'CMakeCache.txt') (Join-Path $prefix 'tdlib-CMakeCache.txt')
          cmake --install $build --config Release 2>&1 | Tee-Object -FilePath .ci\windows-msvc\tdlib-install.log
          if ($LASTEXITCODE -ne 0) { throw "TDLib install failed: $LASTEXITCODE" }
          $tdjson = Join-Path $prefix 'bin\tdjson.dll'
          if (-not (Test-Path $tdjson)) { throw "TDLib package missing $tdjson" }
          $tdjsonImportLibrary = Join-Path $prefix 'lib\tdjson.lib'
          if (-not (Test-Path $tdjsonImportLibrary)) { throw "TDLib import library missing $tdjsonImportLibrary" }
          @(
            "commit=$env:TDLIB_COMMIT"
            "schema=$((Get-FileHash -Algorithm SHA256 td\td\generate\scheme\td_api.tl).Hash)"
            "cl=${{ steps.provenance.outputs.cl }}"
            "sdk=${{ steps.provenance.outputs.sdk }}"
            "generator=Ninja"
            "build_type=Release"
            "triplet=x64-windows"
            "td_install_shared=ON"
            "td_install_static=OFF"
            "vcpkg=$(& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)"
            "tdjson=$((Get-FileHash -Algorithm SHA256 $tdjson).Hash)"
            "tdjson_import=$((Get-FileHash -Algorithm SHA256 $tdjsonImportLibrary).Hash)"
          ) | Set-Content (Join-Path $prefix 'tdlua-tdlib-manifest.txt')

      - name: Verify cached TDLib provenance and PE architecture
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib'
          $manifest = Join-Path $prefix 'tdlua-tdlib-manifest.txt'
          if (-not (Test-Path $manifest)) { throw 'TDLib provenance manifest missing' }
          $content = Get-Content $manifest -Raw
          if ($content -notmatch [regex]::Escape("commit=$env:TDLIB_COMMIT")) { throw 'Cached TDLib commit does not match pinned source' }
          $schema = (Get-FileHash -Algorithm SHA256 td\td\generate\scheme\td_api.tl).Hash
          if ($content -notmatch [regex]::Escape("schema=$schema")) { throw 'Cached TDLib schema hash mismatch' }
          if ($content -notmatch [regex]::Escape('cl=${{ steps.provenance.outputs.cl }}')) { throw 'Cached TDLib compiler mismatch' }
          if ($content -notmatch [regex]::Escape('sdk=${{ steps.provenance.outputs.sdk }}')) { throw 'Cached TDLib SDK mismatch' }
          foreach ($expectedConfig in @('generator=Ninja', 'build_type=Release', 'triplet=x64-windows', 'td_install_shared=ON', 'td_install_static=OFF')) {
            if ($content -notmatch [regex]::Escape($expectedConfig)) { throw "Cached TDLib config mismatch: $expectedConfig" }
          }
          $vcpkgCommit = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($content -notmatch [regex]::Escape("vcpkg=$vcpkgCommit")) { throw 'Cached TDLib dependency registry mismatch' }
          $tdjson = Join-Path $prefix 'bin\tdjson.dll'
          if (-not (Test-Path $tdjson)) { throw 'TDLib DLL missing from staged package' }
          $tdjsonImportLibrary = Join-Path $prefix 'lib\tdjson.lib'
          if (-not (Test-Path $tdjsonImportLibrary)) { throw 'TDLib import library missing from staged package' }
          $tdjsonHash = (Get-FileHash -Algorithm SHA256 $tdjson).Hash
          if ($content -notmatch [regex]::Escape("tdjson=$tdjsonHash")) { throw 'Cached TDLib artifact hash mismatch' }
          $tdjsonImportHash = (Get-FileHash -Algorithm SHA256 $tdjsonImportLibrary).Hash
          if ($content -notmatch [regex]::Escape("tdjson_import=$tdjsonImportHash")) { throw 'Cached TDLib import library hash mismatch' }
          dumpbin.exe /headers $tdjson | Tee-Object -FilePath .ci\windows-msvc\tdjson-headers.log
          dumpbin.exe /headers $tdjson | Select-String '8664 machine' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'TDLib artifact is not PE x64' }
          dumpbin.exe /dependents $tdjson | Tee-Object -FilePath .ci\windows-msvc\tdjson-dependencies.log
          Get-FileHash -Algorithm SHA256 $tdjson | Tee-Object -FilePath .ci\windows-msvc\tdjson-sha256.log

      - name: Save verified TDLib package cache
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/windows-msvc/tdlib
          key: tdlib-msvc-${{ runner.os }}-${{ runner.arch }}-cl${{ steps.provenance.outputs.cl }}-sdk${{ steps.provenance.outputs.sdk }}-${{ env.TDLIB_COMMIT }}-${{ steps.provenance.outputs.schema }}-${{ steps.provenance.outputs.vcpkg }}-release-shared-${{ hashFiles('td/CMakeLists.txt', '.github/workflows/windows-msvc-json.yml') }}

      - name: Build Lua 5.4.8 with MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\windows\compile-lua-msvc.ps1 `
            -WorkDirectory "$env:RUNNER_TEMP\lua-msvc" `
            -InstallDirectory "$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua"
          if ($LASTEXITCODE -ne 0) { throw "Lua build script failed: $LASTEXITCODE" }
          $lua = "$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua"
          dumpbin.exe /headers "$lua\lua54.dll" | Tee-Object -FilePath .ci\windows-msvc\lua-headers.log
          dumpbin.exe /headers "$lua\lua54.dll" | Select-String '8664 machine' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Lua DLL is not PE x64' }
          dumpbin.exe /dependents "$lua\lua54.dll" | Tee-Object -FilePath .ci\windows-msvc\lua-dependencies.log
          "LUA_INCLUDE_DIR=$lua" >> $env:GITHUB_ENV
          "LUA_LIBRARY=$lua\lua54.lib" >> $env:GITHUB_ENV
          "LUA_EXECUTABLE=$lua\lua.exe" >> $env:GITHUB_ENV
          "PATH=$lua;$env:PATH" >> $env:GITHUB_ENV

      - name: Configure and build TDLua JSON MSVC
        id: tdlua-build
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = (Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib')
          $tdluaBuild = (Join-Path $env:GITHUB_WORKSPACE 'build-windows-msvc')
          cmake -S . -B $tdluaBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTd_DIR="$prefix\lib\cmake\Td" `
            -DTDLUA_BACKEND=json `
            -DTDLUA_BUNDLED_TDLIB=OFF `
            -DTDLUA_BUILD_TESTS=ON `
            -DLUA_INCLUDE_DIR="$env:LUA_INCLUDE_DIR" `
            -DLUA_LIBRARY="$env:LUA_LIBRARY" `
            -DLUA_EXECUTABLE="$env:LUA_EXECUTABLE" `
            -DTDLUA_LUA_EXECUTABLE="$env:LUA_EXECUTABLE" `
            -DCMAKE_C_FLAGS=/DLUA_BUILD_AS_DLL `
            -DCMAKE_CXX_FLAGS=/DLUA_BUILD_AS_DLL
          if ($LASTEXITCODE -ne 0) { throw "TDLua configure failed: $LASTEXITCODE" }
          cmake --build $tdluaBuild --config Release --parallel 2 2>&1 | Tee-Object -FilePath .ci\windows-msvc\tdlua-build.log
          if ($LASTEXITCODE -ne 0) { throw "TDLua build failed: $LASTEXITCODE" }
          Copy-Item (Join-Path $tdluaBuild 'CMakeCache.txt') .ci\windows-msvc\tdlua-CMakeCache.txt
          ctest --test-dir $tdluaBuild -N -V 2>&1 | Tee-Object -FilePath .ci\windows-msvc\ctest-list.log
          if ($LASTEXITCODE -ne 0) { throw "ctest listing failed: $LASTEXITCODE" }

      - name: Verify MSVC Release compile configuration
        if: always() && steps.tdlua-build.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build-windows-msvc'
          $logDir = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc'
          $compileCommands = Join-Path $build 'compile_commands.json'
          if (-not (Test-Path $compileCommands)) { throw 'TDLua did not export compile_commands.json' }
          $entries = Get-Content $compileCommands -Raw | ConvertFrom-Json
          $cxxCommands = @($entries |
            Where-Object { $_.file -match '\.cpp$' -and $_.command -match 'cl\.exe' -and $_.file -notmatch '[\\/]td[\\/]td[\\/]' })
          if ($cxxCommands.Count -eq 0) { throw 'No MSVC C++ compile command was recorded' }
          $withoutEhsc = @($cxxCommands | Where-Object { $_.command -notmatch '[-/]EHsc\b' })
          $withoutO2 = @($cxxCommands | Where-Object { $_.command -notmatch '[-/]O2\b' })
          $buildLogPath = Join-Path $logDir 'tdlua-build.log'
          $c4530 = if (Test-Path $buildLogPath) { ([regex]::Matches((Get-Content $buildLogPath -Raw), 'C4530')).Count } else { 0 }
          $dependents = dumpbin.exe /dependents (Join-Path $build 'tdlua.dll') 2>&1 | Out-String
          $dynamicCrt = [bool]($dependents -match '(?i)VCRUNTIME140\.dll')
          @(
            "cxx_compile_commands=$($cxxCommands.Count)"
            "without_ehsc=$($withoutEhsc.Count)"
            "without_O2=$($withoutO2.Count)"
            "C4530_lines=$c4530"
            "dynamic_crt_dependent=$($dynamicCrt.ToString().ToLowerInvariant())"
          ) | Set-Content (Join-Path $logDir 'tdlua-compile-flags.txt')
          if ($withoutEhsc.Count -gt 0) { throw "TDLua C++ compilation is not using /EHsc in $($withoutEhsc.Count) command(s)" }
          if ($withoutO2.Count -gt 0) { throw "TDLua Release C++ compilation is not using /O2 in $($withoutO2.Count) command(s)" }
          if ($c4530 -ne 0) { throw "MSVC emitted C4530 $c4530 time(s): the /EHsc contract is broken" }
          if (-not $dynamicCrt) { throw 'TDLua module does not import the dynamic CRT: expected /MD' }

      - name: Verify module and run full CTest
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build-windows-msvc'
          $env:PATH = "$env:GITHUB_WORKSPACE\.ci\windows-msvc\tdlib\bin;$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua;$build;$env:PATH"
          $env:LUA_CPATH = "$build\?.dll"
          $testList = ctest --test-dir $build --show-only=json-v1 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate CTest tests' }
          $testManifest = ($testList -join "`n") | ConvertFrom-Json
          $testNames = @($testManifest.tests | ForEach-Object { $_.name })
          $testNames | Set-Content .ci\windows-msvc\ctest-test-names.txt
          $expectedTestNames = @(
            'tdlua_core_anchor_ownership', 'tdlua_managed_routing_oom', 'tdlua_json_push_oom',
            'tdlua_client_pump', 'tdlua_lua_protected', 'tdlua_shutdown_admission',
            'tdlua_receiver_runtime', 'tdlua_receiver_generic_fifo_metadata',
            'tdlua_receiver_lifecycle_ownership',
            'tdlua_buffering_accounting', 'tdlua_scheduler_concurrency',
            'tdlua_retention_policy_poc', 'tdlua_codec', 'tdlua_managed_adapter',
            'tdlua_common_router', 'tdlua_hardening_common', 'tdlua_managed_driver_common',
            'tdlua_fake_client', 'tdlua_terminal_shutdown', 'tdlua_harness_cleanup',
            'tdlua_hardening_fake', 'tdlua_handler_only_prefilter', 'tdlua_handler_mutation',
            'tdlua_managed_driver', 'tdlua_m5_conformance', 'tdlua_simple_bot_example',
            'tdlua_async_demo', 'tdlua_vm_threads', 'tdlua_release', 'tdlua_uploadtravis',
            'tdlua_hardening_backend', 'tdlua_lifecycle',
            'tdlua_failure_cleanup_phases',
            'tdlua_async',
            'tdlua_backend_parity', 'tdlua_e2e_smoke', 'tdlua_managed_driver_backend',
            'tdlua_windows_residency'
          )
          $actualSorted = @($testNames | Sort-Object)
          $expectedSorted = @($expectedTestNames | Sort-Object)
          if (Compare-Object $expectedSorted $actualSorted) {
            throw "Registered MSVC test manifest differs from the 38-test MinGW/Linux baseline; actual=$($testNames.Count)"
          }
          "Expected platform difference: tdlua_signals is Linux-only; tdlua_windows_residency is Windows-only." | Set-Content .ci\windows-msvc\test-platform-delta.log
          $requiredTests = @('tdlua_release', 'tdlua_receiver_runtime', 'tdlua_shutdown_admission', 'tdlua_lifecycle', 'tdlua_managed_driver_backend', 'tdlua_windows_residency')
          foreach ($requiredTest in $requiredTests) {
            if ($testNames -notcontains $requiredTest) { throw "Required MSVC regression test is not registered: $requiredTest" }
          }
          $module = Join-Path $build 'tdlua.dll'
          dumpbin.exe /headers $module | Tee-Object -FilePath .ci\windows-msvc\tdlua-headers.log
          dumpbin.exe /headers $module | Select-String '8664 machine' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'TDLua artifact is not PE x64' }
          dumpbin.exe /dependents $module | Tee-Object -FilePath .ci\windows-msvc\tdlua-dependencies-test.log
          $dependencyLog = dumpbin.exe /dependents $module | Out-String
          if ($dependencyLog -notmatch '(?i)tdjson\.dll') { throw 'MSVC JSON module does not depend on the staged tdjson.dll' }
          dumpbin.exe /exports $module | Tee-Object -FilePath .ci\windows-msvc\tdlua-exports-test.log
          dumpbin.exe /exports $module | Select-String 'luaopen_tdlua' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'luaopen_tdlua export missing' }
          dumpbin.exe /exports $module | Select-String 'tdlua_json_test_control' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'test-only JSON hooks were not exported' }
          & $env:LUA_EXECUTABLE -e 'local t=require("tdlua"); assert(t.version and t.api_version and t.tdlib_version=="1.8.68"); print(t.version, t.api_version, t.tdlib_version)'
          if ($LASTEXITCODE -ne 0) { throw 'require(tdlua) failed from the build directory' }
          ctest --test-dir $build --output-on-failure -C Release 2>&1 | Tee-Object -FilePath .ci\windows-msvc\ctest-full.log
          $ctestExit = $LASTEXITCODE
          Set-Content -Path .ci\windows-msvc\ctest-full-exit.txt -Value $ctestExit
          $fullLog = Get-Content .ci\windows-msvc\ctest-full.log -Raw
          if ($null -eq $fullLog) { $fullLog = '' }
          # Classify the full CTest run. The summary line is matched exactly: the
          # words "tests failed" also occur in the successful line "100% tests
          # passed, 0 tests failed out of N", so a substring test reports a
          # passing run as failed or not-run. Recent CTest omits the failed
          # clause on a clean run ("100% tests passed out of N").
          $ctestSummary = [regex]::Match(
            $fullLog,
            '(?im)^[ \t]*(\d+)% tests passed(?:, (\d+) tests failed)? out of (\d+)[ \t]*\r?$')
          $notRunCount = [regex]::Matches($fullLog, '\*\*\*Not Run').Count
          $diagnosis = @()
          if ($fullLog -match '(?im)No tests were found') {
            $diagnosis += 'Full CTest discovered no tests to run.'
          } elseif ($ctestSummary.Success) {
            $failedCount = if ($ctestSummary.Groups[2].Success) {
              [int]$ctestSummary.Groups[2].Value
            } else {
              0
            }
            $testCount = [int]$ctestSummary.Groups[3].Value
            if ($failedCount -eq 0) {
              $diagnosis += "Full CTest passed with 0 tests failed out of $testCount."
            } else {
              $diagnosis += "Full CTest reported $failedCount tests failed out of $testCount."
            }
          } elseif ($ctestExit -ne 0) {
            $diagnosis += "Full CTest exited with code $ctestExit and no parsable summary."
          } else {
            $diagnosis += 'Full CTest produced no parsable summary; inspect ctest-full.log.'
          }
          if ($notRunCount -gt 0) {
            $diagnosis += "Full CTest reported $notRunCount not-run tests."
          }
          $diagnosis | Add-Content .ci\windows-msvc\ctest-full-diagnostic.txt

      - name: Repeat Windows managed and lifecycle regressions
        if: always() && steps.provenance.outcome == 'success' && steps.tdlib-cache.outcome != 'failure'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build-windows-msvc'
          $env:PATH = "$env:GITHUB_WORKSPACE\.ci\windows-msvc\tdlib\bin;$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua;$build;$env:PATH"
          $env:LUA_CPATH = "$build\?.dll"
          $results = @()
          $tests = @(
            @{ Name = 'release'; Pattern = '^tdlua_release$'; Count = 100 },
            @{ Name = 'receiver-runtime'; Pattern = '^tdlua_receiver_runtime$'; Count = 20 },
            @{ Name = 'shutdown-admission'; Pattern = '^tdlua_shutdown_admission$'; Count = 20 },
            @{ Name = 'lifecycle'; Pattern = '^tdlua_lifecycle$'; Count = 20 },
            @{ Name = 'managed-driver-backend'; Pattern = '^tdlua_managed_driver_backend$'; Count = 20 },
            @{ Name = 'managed-adapter'; Pattern = '^tdlua_managed_adapter$'; Count = 100 },
            @{ Name = 'managed-routing-oom'; Pattern = '^tdlua_managed_routing_oom$'; Count = 100 },
            @{ Name = 'windows-residency'; Pattern = '^tdlua_windows_residency$'; Count = 20 }
          )
          foreach ($test in $tests) {
            $log = ".ci\windows-msvc\repeat-$($test.Name).log"
            if (Test-Path $log) { Remove-Item $log -Force }
            $exitCodes = @()
            for ($iteration = 1; $iteration -le $test.Count; $iteration++) {
              "=== $($test.Name) iteration $iteration/$($test.Count) ===" | Add-Content $log
              ctest --test-dir $build --output-on-failure -C Release -R $test.Pattern 2>&1 | Tee-Object -FilePath $log -Append
              $exitCodes += $LASTEXITCODE
            }
            $passedCount = @($exitCodes | Where-Object { $_ -eq 0 }).Count
            $failedCount = $exitCodes.Count - $passedCount
            $results += [pscustomobject]@{
              test = $test.Name
              requested = $test.Count
              iterations_run = $exitCodes.Count
              passed = $passedCount
              failed = $failedCount
              exit_codes = $exitCodes
              all_passed = ($exitCodes.Count -eq $test.Count -and $failedCount -eq 0)
            }
          }
          $results | ConvertTo-Json | Set-Content .ci\windows-msvc\repeat-summary.json
          if ($results | Where-Object { -not $_.all_passed }) {
            'One or more required stress repeats failed; see repeat-summary.json and per-test logs.' | Set-Content .ci\windows-msvc\repeat-failure.txt
          }

      - name: Verify production install and absence of test hooks
        if: always() && steps.provenance.outcome == 'success' && steps.tdlua-build.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $prodBuild = Join-Path $env:RUNNER_TEMP 'tdlua-msvc-production'
          $install = Join-Path $env:RUNNER_TEMP 'tdlua-msvc-install'
          cmake -S . -B $prodBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTd_DIR="$env:GITHUB_WORKSPACE\.ci\windows-msvc\tdlib\lib\cmake\Td" `
            -DTDLUA_BACKEND=json -DTDLUA_BUNDLED_TDLIB=OFF -DTDLUA_BUILD_TESTS=OFF `
            -DLUA_INCLUDE_DIR="$env:LUA_INCLUDE_DIR" -DLUA_LIBRARY="$env:LUA_LIBRARY" `
            -DLUA_EXECUTABLE="$env:LUA_EXECUTABLE" -DTDLUA_LUA_EXECUTABLE="$env:LUA_EXECUTABLE" `
            -DCMAKE_C_FLAGS=/DLUA_BUILD_AS_DLL -DCMAKE_CXX_FLAGS=/DLUA_BUILD_AS_DLL `
            -DCMAKE_INSTALL_PREFIX="$install"
          if ($LASTEXITCODE -ne 0) { throw "production configure failed: $LASTEXITCODE" }
          cmake --build $prodBuild --config Release --parallel 2 2>&1 | Tee-Object -FilePath .ci\windows-msvc\production-build.log
          if ($LASTEXITCODE -ne 0) { throw "production build failed: $LASTEXITCODE" }
          Copy-Item (Join-Path $prodBuild 'CMakeCache.txt') .ci\windows-msvc\production-CMakeCache.txt
          cmake --install $prodBuild --config Release 2>&1 | Tee-Object -FilePath .ci\windows-msvc\production-install.log
          if ($LASTEXITCODE -ne 0) { throw "production install failed: $LASTEXITCODE" }
          $prodModule = Join-Path $install 'lib\lua\5.4\tdlua.dll'
          if (-not (Test-Path $prodModule)) { throw "installed module missing: $prodModule" }
          $exports = dumpbin.exe /exports $prodModule
          $exports | Tee-Object -FilePath .ci\windows-msvc\tdlua-exports-production.log
          if (($exports | Select-String 'luaopen_tdlua').Count -ne 1) { throw 'production luaopen export missing' }
          if ($exports | Select-String 'tdlua_.*_test_|tdlua_test_live_scheduler') { throw 'test-only accessor leaked into production DLL' }
          dumpbin.exe /dependents $prodModule | Tee-Object -FilePath .ci\windows-msvc\tdlua-dependencies-production.log
          $env:LUA_CPATH = "$install\lib\lua\5.4\?.dll"
          $env:PATH = "$env:GITHUB_WORKSPACE\.ci\windows-msvc\tdlib\bin;$install\lib\lua\5.4;$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua;$env:PATH"
          & $env:LUA_EXECUTABLE -e 'local t=require("tdlua"); assert(t.version and t.api_version and t.tdlib_version=="1.8.68"); print(t.version, t.api_version, t.tdlib_version)'
          if ($LASTEXITCODE -ne 0) { throw 'require(tdlua) failed from clean install prefix' }
          Get-FileHash -Algorithm SHA256 $prodModule | Tee-Object -FilePath .ci\windows-msvc\installed-module-sha256.log

      - name: Package the Windows x64 JSON module
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'tdlua-msvc-install'
          $prodBuild = Join-Path $env:RUNNER_TEMP 'tdlua-msvc-production'
          $tdlibBin = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib\bin'
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\bin'
          $rootParent = Join-Path $env:RUNNER_TEMP 'tdlua-pkg-json'
          $root = Join-Path $rootParent 'tdlua'
          if (Test-Path $rootParent) { Remove-Item -Recurse -Force $rootParent }
          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root 'share\licenses\tdlua') | Out-Null

          $module = Join-Path $install 'lib\lua\5.4\tdlua.dll'
          if (-not (Test-Path $module)) { throw "installed module missing: $module" }
          $tdjson = Join-Path $tdlibBin 'tdjson.dll'
          if (-not (Test-Path $tdjson)) { throw "TDLib JSON DLL missing: $tdjson" }
          Copy-Item $module (Join-Path $root 'tdlua.dll')
          Copy-Item $tdjson (Join-Path $root 'tdjson.dll')

          # Ship only DLLs that the module and its dependencies actually import
          # and that are not provided by Windows or by the host's Microsoft
          # CRT. Resolve the whole transitive graph instead of hardcoding a list:
          # a vcpkg update that renames a runtime DLL must fail here, not at the
          # user's first require().
          $hostProvided = @(
            'lua54.dll',
            'kernel32.dll', 'user32.dll', 'advapi32.dll', 'ws2_32.dll',
            'shell32.dll', 'ole32.dll', 'oleaut32.dll', 'crypt32.dll',
            'bcrypt.dll', 'secur32.dll', 'iphlpapi.dll', 'dnsapi.dll',
            'userenv.dll', 'psapi.dll', 'dbghelp.dll', 'msvcrt.dll',
            'ntdll.dll', 'shlwapi.dll', 'version.dll', 'winmm.dll',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll',
            'concrt140.dll', 'ucrtbase.dll'
          )
          $searchDirs = @($tdlibBin, $vcpkgBin)
          $pending = New-Object System.Collections.Queue
          Get-ChildItem $root -Filter *.dll | ForEach-Object { $pending.Enqueue($_.FullName) }
          $seen = @{}
          $shipped = @()
          while ($pending.Count -gt 0) {
            $file = $pending.Dequeue()
            $leaf = Split-Path $file -Leaf
            $key = $leaf.ToLowerInvariant()
            if ($seen.ContainsKey($key)) { continue }
            $seen[$key] = $true
            $deps = & dumpbin.exe /dependents $file 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed for $file" }
            foreach ($line in $deps) {
              if ($line -notmatch '^\s+([A-Za-z0-9._-]+\.dll)\s*$') { continue }
              $name = $Matches[1]
              $lower = $name.ToLowerInvariant()
              if ($lower -match '^(api-ms-win-|ext-ms-)') { continue }
              if ($hostProvided -contains $lower) { continue }
              $target = Join-Path $root $name
              if (Test-Path $target) {
                $pending.Enqueue($target)
                continue
              }
              $resolved = $null
              foreach ($dir in $searchDirs) {
                $candidate = Join-Path $dir $name
                if (Test-Path $candidate) { $resolved = $candidate; break }
              }
              if (-not $resolved) {
                throw "unresolved runtime dependency $name, imported by $leaf"
              }
              Copy-Item $resolved $target
              $shipped += $name
              $pending.Enqueue($target)
            }
          }
          $shipped = @($shipped | Sort-Object -Unique)

          foreach ($license in @(
              @('LICENSE', 'LICENSE'),
              @('NOTICE', 'NOTICE'),
              @('td\LICENSE_1_0.txt', 'TDLib-LICENSE_1_0.txt'))) {
            $source = Join-Path $env:GITHUB_WORKSPACE $license[0]
            if (-not (Test-Path $source)) { throw "license missing: $source" }
            Copy-Item $source (Join-Path $root ('share\licenses\tdlua\' + $license[1]))
          }
          # Every redistributed third-party DLL must carry its notice. vcpkg
          # keeps the upstream license text under share/<port>/copyright.
          foreach ($port in @('openssl', 'zlib')) {
            $notice = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\share\$port\copyright"
            if (-not (Test-Path $notice)) { throw "vcpkg notice missing: $notice" }
            Copy-Item $notice (Join-Path $root "share\licenses\tdlua\$port-copyright.txt")
          }

          $version = (Get-Content (Join-Path $prodBuild 'tdlua-version.txt') -Raw).Trim()
          if (-not $version) { throw 'tdlua-version.txt is empty' }
          $tdConfig = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib\lib\cmake\Td\TdConfigVersion.cmake'
          $tdlibVersion = (Select-String -Path $tdConfig -Pattern 'set\(PACKAGE_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
          if (-not $tdlibVersion) { throw 'TDLib version not found in TdConfigVersion.cmake' }
          $moduleSha = (Get-FileHash -Algorithm SHA256 (Join-Path $root 'tdlua.dll')).Hash.ToLowerInvariant()
          @(
            'package=tdlua'
            "version=$version"
            'platform=windows-x64'
            'os=windows'
            'arch=x86_64'
            'lua_implementation=Lua'
            'lua_version=5.4'
            'backend=json'
            "tdlib_version=$tdlibVersion"
            "source_sha=$env:GITHUB_SHA"
            'module=tdlua.dll'
            "module_sha256=$moduleSha"
            "redistributed_dlls=tdjson.dll,$($shipped -join ',')"
          ) | Set-Content (Join-Path $root 'MANIFEST.txt')

          $zip = Join-Path $env:RUNNER_TEMP 'tdlua-5.4-win64-json.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $root -DestinationPath $zip

          # Verify the ZIP, not the build tree: extract elsewhere, then require
          # the module with only the extracted directory, the separately
          # provided Lua 5.4 runtime and the system directories on PATH.
          $verify = Join-Path $env:RUNNER_TEMP 'tdlua-pkg-verify-json'
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive -Path $zip -DestinationPath $verify
          $extracted = Join-Path $verify 'tdlua'
          $extractedModule = Join-Path $extracted 'tdlua.dll'
          if (-not (Test-Path $extractedModule)) { throw 'extracted module missing' }
          $manifest = Get-Content (Join-Path $extracted 'MANIFEST.txt') -Raw
          if ($manifest -notmatch "(?m)^source_sha=$([regex]::Escape($env:GITHUB_SHA))$") {
            throw 'package manifest does not name this commit'
          }
          $extractedSha = (Get-FileHash -Algorithm SHA256 $extractedModule).Hash.ToLowerInvariant()
          if ($extractedSha -ne $moduleSha) { throw 'extracted module hash differs from manifest' }
          $exports = dumpbin.exe /exports $extractedModule
          if (($exports | Select-String 'luaopen_tdlua').Count -ne 1) { throw 'extracted package has no single luaopen_tdlua export' }
          if ($exports | Select-String 'tdlua_.*_test_|tdlua_test_live_scheduler') { throw 'test accessor found in extracted package' }
          $env:PATH = "$extracted;$env:GITHUB_WORKSPACE\.ci\windows-msvc\lua;C:\Windows\system32;C:\Windows"
          $env:LUA_CPATH = "$extracted\?.dll"
          & $env:LUA_EXECUTABLE -e 'local t=require("tdlua"); assert(t.version and t.api_version and t.tdlib_version); print("extracted package", t.version, t.api_version, t.tdlib_version)'
          if ($LASTEXITCODE -ne 0) { throw 'require(tdlua) failed for the extracted JSON package' }
          @(
            "zip=$zip"
            "zip_sha256=$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant())"
            'extracted_require=pass'
            "redistributed_dlls=$($shipped -join ',')"
            'lua54_shipped=false'
            'crt_shipped=false'
          ) | Set-Content .ci\windows-msvc\package-verdict.txt
          Get-FileHash -Algorithm SHA256 $zip | Tee-Object -FilePath .ci\windows-msvc\package-sha256.log
          Get-ChildItem $extracted -File | Select-Object Name, Length |
            Format-Table -AutoSize | Out-String |
            Tee-Object -FilePath .ci\windows-msvc\package-listing.log

      - name: Diagnose managed adapter heap corruption with MSVC AddressSanitizer
        if: always() && contains(github.event.head_commit.message, '[msvc-asan-diagnostic]') && steps.tdlua-build.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = '.ci\windows-msvc\asan'
          New-Item -ItemType Directory -Force -Path $diagnostic | Out-Null
          $asanBuild = Join-Path $env:RUNNER_TEMP 'tdlua-msvc-asan'
          $asanLua = Join-Path $diagnostic 'lua'
          $tdlib = Join-Path $env:GITHUB_WORKSPACE '.ci\windows-msvc\tdlib'
          $flags = '/Zi /O2 /Ob1 /DNDEBUG /fsanitize=address'
          & .\tools\windows\compile-lua-msvc.ps1 `
            -WorkDirectory "$env:RUNNER_TEMP\lua-msvc-asan" `
            -InstallDirectory $asanLua -AddressSanitizer 2>&1 |
            Tee-Object -FilePath (Join-Path $diagnostic 'lua-build.log')
          if ($LASTEXITCODE -ne 0) { throw "Lua ASan build failed: $LASTEXITCODE" }
          @(
            'Test: tdlua_managed_adapter only'
            'Compiler: MSVC x64, AddressSanitizer enabled on the test executable and Lua 5.4.8 DLL'
            'TDLua module is not linked into this test; TDLib is not used by this test'
            "CXX flags: $flags"
            'CMake MSVC runtime: MultiThreadedDLL (/MD)'
          ) | Set-Content (Join-Path $diagnostic 'coverage.txt')
          cmake -S . -B $asanBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=$flags" `
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=$flags" `
            '-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO /fsanitize=address' `
            -DTDLUA_BACKEND=json -DTDLUA_BUNDLED_TDLIB=OFF -DTDLUA_BUILD_TESTS=ON `
            "-DTd_DIR=$tdlib\lib\cmake\Td" `
            "-DLUA_INCLUDE_DIR=$asanLua" `
            "-DLUA_LIBRARY=$asanLua\lua54.lib" `
            "-DLUA_EXECUTABLE=$asanLua\lua.exe" `
            "-DTDLUA_LUA_EXECUTABLE=$asanLua\lua.exe" 2>&1 |
            Tee-Object -FilePath (Join-Path $diagnostic 'configure.log')
          if ($LASTEXITCODE -ne 0) { throw "ASan configure failed: $LASTEXITCODE" }
          cmake --build $asanBuild --target tdlua_managed_adapter_test --config RelWithDebInfo --parallel 2 2>&1 |
            Tee-Object -FilePath (Join-Path $diagnostic 'build.log')
          if ($LASTEXITCODE -ne 0) { throw "ASan target build failed: $LASTEXITCODE" }
          $testExe = Join-Path $asanBuild 'tdlua_managed_adapter_test.exe'
          $pdb = Join-Path $asanBuild 'tdlua_managed_adapter_test.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $diagnostic 'tdlua_managed_adapter_test.pdb') }
          dumpbin.exe /dependents $testExe | Tee-Object -FilePath (Join-Path $diagnostic 'test-dependencies.log')
          dumpbin.exe /dependents (Join-Path $asanLua 'lua54.dll') | Tee-Object -FilePath (Join-Path $diagnostic 'lua-dependencies.log')
          $luaPdb = Join-Path $asanLua 'lua54.pdb'
          if (Test-Path $luaPdb) { Copy-Item $luaPdb (Join-Path $diagnostic 'lua54.pdb') }
          $env:ASAN_OPTIONS = 'halt_on_error=1'
          $env:PATH = "$asanLua;$env:PATH"
          $codes = @()
          $testLog = Join-Path $diagnostic 'repeat.log'
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            "=== managed_adapter ASan iteration $iteration/20 ===" | Add-Content $testLog
            ctest --test-dir $asanBuild --output-on-failure -C RelWithDebInfo -R '^tdlua_managed_adapter$' 2>&1 |
              Tee-Object -FilePath $testLog -Append
            $codes += $LASTEXITCODE
          }
          $passed = @($codes | Where-Object { $_ -eq 0 }).Count
          @("requested=20", "iterations_run=$($codes.Count)", "passed=$passed", "failed=$($codes.Count - $passed)", "exit_codes=$($codes -join ',')") |
            Set-Content (Join-Path $diagnostic 'summary.txt')
          Get-FileHash -Algorithm SHA256 $testExe | Out-File (Join-Path $diagnostic 'test-executable-sha256.log')
          # Keep the diagnostic result in the artifact and raw log. The main MSVC
          # validation remains governed by its unmodified CTest and stress gates.

      - name: Enforce all MSVC validation results
        if: always() && steps.provenance.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $ctestExitPath = '.ci\windows-msvc\ctest-full-exit.txt'
          if (-not (Test-Path $ctestExitPath)) { throw 'Full CTest did not produce an exit record' }
          $ctestExit = [int](Get-Content $ctestExitPath -Raw)
          if ($ctestExit -ne 0) { throw "Full CTest failed: $ctestExit" }
          $repeatFailure = '.ci\windows-msvc\repeat-failure.txt'
          if (Test-Path $repeatFailure) { throw (Get-Content $repeatFailure -Raw) }

      - name: Upload Windows JSON package
        uses: actions/upload-artifact@v7
        with:
          name: tdlua-windows-x64-json-package
          path: ${{ runner.temp }}/tdlua-5.4-win64-json.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSVC validation logs and manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-json-${{ github.run_id }}
          path: .ci/windows-msvc/
          if-no-files-found: warn
          retention-days: 30
